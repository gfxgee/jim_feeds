name: Mirror feed

on:
  schedule:
    # Minute 7 rather than 0 — top-of-hour is the busiest slot on GitHub's
    # shared scheduler and runs there are the most likely to be delayed.
    - cron: '7 * * * *'
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write           # needed to push the updated latest.xml

concurrency:
  group: mirror-feed
  cancel-in-progress: false # never cancel a run mid-push

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Fetch and validate feeds
        env:
          FEED_BASE_DIR: ${{ github.workspace }}/docs
          FEED_KEEP_SNAPSHOTS: '0'   # git history is the snapshot history
        run: |
          chmod +x ./fetch-feed.sh
          # Every feed runs even if an earlier one fails — one broken upstream
          # must not stop the others from being mirrored. Codes are reported
          # after the commit step so a bad feed never blocks a good one's push.
          set +e
          : > "$RUNNER_TEMP/feed-results"
          # tr -d '\r' so a feeds.txt saved with CRLF cannot create a label with a
          # trailing carriage return. `|| [ -n "$url" ]` so a file saved without a
          # trailing newline still processes its last line instead of dropping a feed.
          while IFS='|' read -r url label opts || [ -n "$url" ]; do
            case "$url" in ''|\#*) continue ;; esac
            repair=""; stale=""; enrich=""
            IFS=',' read -ra parts <<< "$opts"
            for p in "${parts[@]}"; do
              case "$p" in
                repair=*) repair="${p#repair=}" ;;
                stale=*)  stale="${p#stale=}"   ;;
                enrich=*) enrich="${p#enrich=}" ;;
              esac
            done
            export FEED_REPAIR="$repair"
            export FEED_ENRICH="$enrich"
            # Leave FEED_STALE_HOURS unset when no per-feed value, so the script's
            # own default stays the single source of truth for that number.
            if [ -n "$stale" ]; then export FEED_STALE_HOURS="$stale"; else unset FEED_STALE_HOURS; fi
            ./fetch-feed.sh "$url" "$label" < /dev/null
            echo "$label $?" >> "$RUNNER_TEMP/feed-results"
          done < <(tr -d '\r' < feeds.txt)
          cat "$RUNNER_TEMP/feed-results"

      - name: Commit if any feed changed
        run: |
          git config user.name  "feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/ && [ -z "$(git ls-files --others --exclude-standard docs/)" ]; then
            echo "No change — nothing to commit."
            exit 0
          fi
          # Name only the feeds that actually moved, so the log stays readable.
          changed=$(git status --porcelain -- docs/ | awk '{print $NF}' | cut -d/ -f2 | sort -u | paste -sd, -)
          git add docs/
          git commit -m "feed: $changed $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Fail the run if any fetch was unhealthy
        run: |
          rc=0
          while read -r label code; do
            case "$code" in
              0) echo "$label: feed healthy." ;;
              2) echo "::error::$label — fetch failed: upstream unreachable or returned an error status."; rc=1 ;;
              3) echo "::error::$label — response was not a feed: upstream is likely serving an error or maintenance page."; rc=1 ;;
              4) echo "::error::$label — feed parsed but contained zero items."; rc=1 ;;
              5) echo "::warning::$label — feed is valid but stale: no new items within the freshness window."; rc=1 ;;
              *) echo "::error::$label — unexpected exit code $code"; rc=1 ;;
            esac
          done < "$RUNNER_TEMP/feed-results"
          exit $rc
